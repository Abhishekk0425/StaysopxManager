    <div class="login-form" id="loginForm">
      <label>Work email
        <input type="email" id="loginEmail" placeholder="you@company.com" autocomplete="email">

        <span class="pw-wrap">
          <input type="password" id="loginCode" placeholder="Your access code" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle" onclick="toggleCode('loginCode','pwToggle')" aria-label="Show access code" aria-pressed="false" title="Show access code">

            </svg>
          </button>
        </span>
      </label>

            <span class="profile-caret" aria-hidden="true">▾</span>
          </button>
          <div class="profile-panel hidden" id="profilePanel">
            <div class="profile-head">
              <span class="avatar avatar-lg" id="userAvatarLg">?</span>
              <div class="profile-meta">
                <strong id="userName">—</strong>
                <span id="userEmail">—</span>
              </div>
            </div>
            <dl class="profile-rows">
              <div><dt>Role</dt><dd id="userRole">—</dd></div>
              <div><dt>Department</dt><dd id="userDept">—</dd></div>
            </dl>
            <button class="btn profile-logout" onclick="logout()"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M15 8l4 4-4 4M19 12H9"/></svg>Log out</button>
          </div>
        </div>
      </div>
    </header>
    <div class="view-container" id="viewContainer"></div>
  </main>
</div>

<!-- ============ MODALS ============ -->
<div class="modal-backdrop hidden" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modalBox" role="dialog" aria-modal="true"></div>
</div>

<div class="modal-backdrop hidden" id="confirmBackdrop">
  <div class="modal modal-sm" role="alertdialog">
    <h3 id="confirmTitle">Are you sure?</h3>
    <p id="confirmText" class="muted"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="resolveConfirm(false)">Cancel</button>
      <button class="btn btn-danger" id="confirmOkBtn" onclick="resolveConfirm(true)">Confirm</button>
    </div>
  </div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="script.js?v=2.3.2"></script>
</body>
</html>
